# Log4j configuration for Kafka Connect Template
log4j.rootLogger=INFO, console

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%t] %-5p %c{1} - %m%n

# Your connector package - set to DEBUG for detailed logs
log4j.logger.com.example.kafka.connect=DEBUG

# Kafka Connect framework
log4j.logger.org.apache.kafka.connect=INFO

# Reduce noise from Kafka clients
log4j.logger.org.apache.kafka.clients=WARN

