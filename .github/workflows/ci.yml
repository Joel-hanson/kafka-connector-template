name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  MAVEN_OPTS: "-Xmx1024m"

jobs:
  # Quick validation job - runs first to fail fast
  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11 (baseline)
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Validate Maven configuration
        run: mvn validate

      - name: Compile project
        run: mvn clean compile -B

  # Unit tests across Java versions
  unit-tests:
    name: Unit Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-java${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-java${{ matrix.java }}-
            ${{ runner.os }}-m2-

      - name: Display Java version info
        run: |
          echo "Java version:"
          java -version
          echo "Maven version:"
          mvn -version

      - name: Run unit tests
        run: mvn clean test -B -Pjava${{ matrix.java }}

      - name: Upload unit test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
          retention-days: 7

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && hashFiles('target/surefire-reports/*.xml') != ''
        with:
          files: target/surefire-reports/*.xml
          check_name: "Unit Test Results (Java ${{ matrix.java }})"
          comment_mode: always
          fail_on: "test failures"

  # Integration tests across Java versions
  integration-tests:
    name: Integration Tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-java${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-java${{ matrix.java }}-
            ${{ runner.os }}-m2-

      - name: Run integration tests
        run: mvn clean integration-test -B -Pjava${{ matrix.java }}
        env:
          MAVEN_OPTS: "-Xmx2048m"

      - name: Upload integration test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-reports-java-${{ matrix.java }}
          path: |
            target/failsafe-reports/
            target/integration-test.log
          retention-days: 7

      - name: Publish integration test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && hashFiles('target/failsafe-reports/TEST-*.xml') != ''
        with:
          files: target/failsafe-reports/TEST-*.xml
          check_name: "Integration Test Results (Java ${{ matrix.java }})"
          comment_mode: always
          fail_on: "test failures"

  # Build verification
  build:
    name: Build (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-java${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-java${{ matrix.java }}-
            ${{ runner.os }}-m2-

      - name: Build and package
        run: mvn clean package -B -DskipTests -Pjava${{ matrix.java }}

      - name: Verify JAR contents
        run: |
          ls -la target/
          if ls target/kafka-connector-template-*-jar-with-dependencies.jar 1> /dev/null 2>&1; then
            echo "✅ Fat JAR created successfully"
            jar -tf target/kafka-connector-template-*-jar-with-dependencies.jar | head -10
          else
            echo "❌ Fat JAR not found"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: matrix.java == '11' # Only upload artifacts from Java 11 build
        with:
          name: connector-jar
          path: target/kafka-connector-template-*-jar-with-dependencies.jar
          retention-days: 30
