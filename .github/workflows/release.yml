name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Allow manual releases
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Validate project
        run: mvn validate

      - name: Run tests
        run: mvn clean test -B

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: validate-release
    strategy:
      matrix:
        java: ["11", "17", "21"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-java${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-java${{ matrix.java }}-
            ${{ runner.os }}-m2-

      - name: Build and package
        run: mvn clean package -B -DskipTests -Pjava${{ matrix.java }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kafka-connector-java-${{ matrix.java }}
          path: target/kafka-connector-template-*-jar-with-dependencies.jar
          retention-days: 90

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: kafka-connector-java-11
          path: release-artifacts/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.validate-release.outputs.version }}
          release_name: Release ${{ needs.validate-release.outputs.version }}
          body: |
            ## Kafka Connector Template Release ${{ needs.validate-release.outputs.version }}

            ### 🚀 Features
            - Kafka Connect Source and Sink connectors
            - Java 11, 17, and 21 compatibility
            - Comprehensive integration tests

            ### 📦 Artifacts
            - `kafka-connector-template-*-jar-with-dependencies.jar` - Fat JAR with all dependencies

            ### 🔧 Installation
            1. Download the JAR file
            2. Copy to your Kafka Connect plugins directory
            3. Restart Kafka Connect

            ### 📋 Requirements
            - Java 11 or later
            - Kafka Connect 2.8 or later
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-artifacts/kafka-connector-template-0.0.2-jar-with-dependencies.jar
          asset_name: kafka-connector-template-${{ needs.validate-release.outputs.version }}-jar-with-dependencies.jar
          asset_content_type: application/java-archive
